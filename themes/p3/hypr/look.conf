# Persona 3 window look for classic hyprland.conf (source = ~/.config/hypr/persona-theme.conf)
general {
    gaps_in = 3
    gaps_out = 8
    border_size = 3
    col.active_border = rgba(3fd8ffff) rgba(1238d6ff) rgba(f2fbffff) 120deg
    col.inactive_border = rgba(071648ee)
}
decoration {
    rounding = 0
    dim_inactive = true
    dim_strength = 0.15
    blur {
        enabled = true
        size = 9
        passes = 3
        vibrancy = 0.4
        noise = 0.015
    }
    shadow {
        enabled = true
        range = 26
        render_power = 2
        color = rgba(3fd8ff77)
        color_inactive = rgba(00000066)
    }
}
